# OSV-Scanner ignore list (read by OpenSSF Scorecard's Vulnerabilities check
# and by `osv-scanner --lockfile package-lock.json`).
#
# Only devDependency-tree advisories are listed here. Every entry below is
# reachable solely through the Serverless Framework v3 CLI tree (`serverless`,
# `serverless-offline`, `serverless-dotenv-plugin`), which runs on a developer
# machine or in CI to package/deploy and is NEVER part of the Lambda bundle:
# Serverless strips devDependencies from the artifact (docs/DEPLOY.md), and
# `.github/dependabot.yml` pins serverless below v4 on purpose (v4 needs CLI
# auth even for free users). Migrating to serverless v4 is its own task; when
# it lands, delete this file.
#
# Production-dependency advisories are NOT ignorable here. Fix or upgrade them.
#
# Regenerate the split with: `npm audit --json` vs `npm audit --omit=dev --json`.


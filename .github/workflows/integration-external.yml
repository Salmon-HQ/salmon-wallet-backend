# External-provider integration tests: everything the PR gate deliberately
# excludes (CoinGecko / Triton / 0x / public Solana RPC — flaky, rate
# limited, secret-needing). Runs nightly and on demand, never on PRs, so
# provider secrets are never exposed to fork runs.
#
# A failure here means provider drift or a real regression against live
# services — it is a signal for maintainers, not a merge blocker. Suites
# probe their provider first and skip with a logged reason when unreachable
# or unconfigured, so this workflow degrades gracefully while secrets are
# not yet loaded (see docs/REPO-SETTINGS.md for the secret list). A failed
# or timed-out nightly run opens (or comments on) an issue, because GitHub's
# own email reaches only whoever last edited the schedule, and not for a
# timeout, which ends the run as cancelled.
#
# Spec: specs/003-integration-external/spec.md
name: Integration (external providers)

on:
  schedule:
    - cron: '17 6 * * *' # daily 06:17 UTC — off the top-of-hour spike
  workflow_dispatch:

permissions: {}

concurrency:
  group: integration-external
  cancel-in-progress: false

jobs:
  integration-external:
    name: external integration suites
    # The paid provider keys reach only main: a manual dispatch on any other
    # branch skips the job, and the keys live in the `provider-tests`
    # environment, whose deployment-branch rule admits main alone, so a
    # workflow edited on another branch cannot read them either
    # (docs/REPO-SETTINGS.md §5).
    if: github.ref == 'refs/heads/main'
    environment: provider-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    services:
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 6379:6379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install
        run: npm ci

      - name: Integration tests (live providers)
        run: npm run test:integration
        env:
          REDIS_HOST: localhost
          # Provider credentials — `provider-tests` environment secrets; empty
          # until loaded, which makes the corresponding suites probe-skip.
          COINGECKO_API_KEY: ${{ secrets.COINGECKO_API_KEY }}
          TRITON_RPC_URL: ${{ secrets.TRITON_RPC_URL }}
          TRITON_API_TOKEN: ${{ secrets.TRITON_API_TOKEN }}
          ZEROEX_API_KEY: ${{ secrets.ZEROEX_API_KEY }}
          JUPITER_API_KEY: ${{ secrets.JUPITER_API_KEY }}
          SWAP_FEE_BPS: ${{ vars.SWAP_FEE_BPS }}
          SWAP_FEE_ACCOUNT_OWNER: ${{ vars.SWAP_FEE_ACCOUNT_OWNER }}

  # The country gate, checked where it runs: OFAC's guidance asks that IP
  # blocking be tested, not assumed. Prod switches Swap off once its DB-IP
  # database is 45 days old, and deploy.yml redeploys the newest tag on the 2nd
  # of every month to keep it fresh; this goes red at 35 days, when that
  # monthly run has failed or not run.
  production-country-gate:
    name: production country gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Database fresh, runner placed, the US routed to 0x
        env:
          API: ${{ vars.PROD_API_URL || 'https://te4x28v8e0.execute-api.us-east-1.amazonaws.com/prod' }}
        run: |
          status="$(curl -fsS --retry 3 --retry-all-errors --max-time 20 "$API/status")"
          built="$(jq -r '.countryDatabase' <<<"$status")"
          country="$(jq -r '.country' <<<"$status")"
          echo "Country database built ${built}; this runner is placed in ${country}"
          if [ "$built" = "null" ]; then
            echo "::error::Prod reports no country database."
            exit 1
          fi
          age=$(( ( $(date -u +%s) - $(date -u -d "$built" +%s) ) / 86400 ))
          if [ "$age" -gt 35 ]; then
            echo "::error::The country database is ${age} days old: the monthly Deploy run failed or did not run. Deploy before day 45, when prod switches Swap off."
            exit 1
          fi
          if [ "$country" = "null" ]; then
            echo "::error::Prod could not place this runner's address."
            exit 1
          fi
          swap="$(curl -fsS --retry 3 --retry-all-errors --max-time 20 \
            -H 'X-Salmon-Platform: ios' "$API/v1/solana-mainnet/powerups/availability" \
            | jq -c '.data[] | select(.id == "swap")')"
          echo "Swap for ${country}: ${swap}"
          if [ "$country" = "US" ] && [ "$(jq -r '.provider' <<<"$swap")" != "0x" ]; then
            echo "::error::A request from the United States was not routed to 0x."
            exit 1
          fi

  report-failure:
    name: open an issue for a failed scheduled run
    needs: [integration-external, production-country-gate]
    if: >-
      always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    permissions:
      issues: write
    uses: $/.github/workflows/report-scheduled-failure.yml
    with:
      title: Nightly provider checks failing
      consequence: A provider may have changed its API or a key may have stopped working; the country gate may also have found a stale database.

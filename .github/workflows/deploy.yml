name: Deploy

on:
  push:
    tags:
      - prod/*
  # Prod stops placing callers once its DB-IP database is 45 days old, which
  # closes Swap; DB-IP publishes on the 1st. On the 2nd the newest prod/v* tag
  # is redeployed as it is, so each month's database ships with no release.
  schedule:
    - cron: '30 6 2 * *'

permissions: {}

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  # The tag to ship: the pushed one, or on the monthly run the newest prod/v*.
  target:
    name: Target tag
    runs-on: ubuntu-22.04
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.pick.outputs.tag }}
    steps:
      - name: Checkout tags
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Pick the tag
        id: pick
        run: |
          if [ "$GITHUB_EVENT_NAME" = "schedule" ]; then
            tag="$(git tag --list 'prod/v*' --sort=-v:refname | head -n 1)"
          else
            tag="$GITHUB_REF_NAME"
          fi
          if [ -z "$tag" ]; then
            echo "::error::No prod/v* tag to deploy."
            exit 1
          fi
          # A tag can be pushed on any commit, and the pull request checks and
          # reviews only cover what reached main. A tag outside main would ship
          # code nobody reviewed.
          if ! git merge-base --is-ancestor "refs/tags/${tag}" origin/main; then
            echo "::error::${tag} is not on main. Merge the release to main and tag that commit."
            exit 1
          fi
          echo "Deploying ${tag}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

  verify:
    name: Verify
    needs: target
    runs-on: ubuntu-22.04
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.target.outputs.tag }}
      - name: Use Node.js from .nvmrc
        # v7.0.0. Cache is safe here: verify publishes nothing — it only gates.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .nvmrc
          cache: npm

      # GET /status reports package.json's version, so a tag that disagrees with
      # it ships a deploy that misreports itself. This has happened: every tag
      # from prod/v0.7.5 to prod/v0.9.0 shipped while package.json sat at 0.7.4.
      - name: Tag matches package.json version
        env:
          TAG: ${{ needs.target.outputs.tag }}
        run: |
          tag_version="${TAG#prod/v}"
          pkg_version="$(node -p "require('./package.json').version")"
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag ${TAG} declares ${tag_version} but package.json says ${pkg_version}."
            echo "Bump package.json and retag, or delete the tag and push the right one."
            exit 1
          fi
          echo "Tag and package.json agree on ${pkg_version}."

      - name: Install node modules
        run: npm ci

      # Same gate as ci.yml: `linter` is `eslint --fix` (mutates, never fails on
      # warnings), so a tag could ship code the PR gate would have rejected.
      - name: Format check
        run: npm run format:check

      - name: Lint (zero warnings)
        run: npm run lint:check

      - name: Unit tests
        run: npm run test:unit

      # No AWS credentials configured in this job. Confirms the local-stage
      # config resolves entirely from env vars/defaults and never reaches
      # for SSM, before we trust the same serverless.yml with the prod stage.
      # The key only identifies the organisation to Serverless, Inc. (v4 runs
      # no command without one); it grants nothing in AWS.
      - name: Serverless config sanity check (local stage, no AWS creds)
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: npx serverless print --stage local > /dev/null

  # Everything that downloads or installs code runs here, in a job that cannot
  # ask for the deploy role: `id-token: write` is granted per job, so any step
  # of the job that holds it (an install script, the CLI installer) could
  # request the role's token. This job has no secrets and no token to give.
  bundle:
    name: Bundle
    needs: [target, verify]
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.target.outputs.tag }}
      - name: Use Node.js from .nvmrc
        # v7.0.0. Deliberately NO dependency cache: this job builds what ships
        # to prod, and a poisoned cache entry could reach the shipped artifact.
        # Slower install is the accepted cost. `package-manager-cache: false`
        # is explicit because setup-node v7 auto-enables the npm cache the day
        # package.json gains a `packageManager` field. (zizmor can't tell the
        # version from the SHA, hence the ignore.)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      - name: Install node modules
        run: npm ci

      # Same check as ci.yml: every installed package carries a valid registry
      # signature, so a tarball swapped after the lockfile was written fails here.
      - name: Verify registry signatures
        run: npm audit signatures

      # The country gate reads this month's DB-IP database, and on prod it
      # stops placing anyone once the database is 45 days old, which closes
      # Swap. A failure fails the deploy: a database the script could not
      # check is never shipped.
      - name: Refresh the country database
        run: node scripts/refresh-geo-data.mjs

      # Serverless v4 downloads its CLI outside the lockfile; this downloads it
      # and compares it with the fingerprints in scripts/check-serverless-cli.mjs.
      - name: Serverless CLI matches its fingerprints
        run: npm run check:serverless-cli

      # The deploy job receives the tree exactly as it stands here, so it
      # installs and downloads nothing. Nothing in it is secret: public code,
      # public packages and the public country database.
      - name: Pack the workspace and the CLI
        run: |
          tar --zstd -cf "$RUNNER_TEMP/workspace.tar.zst" -C "$GITHUB_WORKSPACE" .
          tar --zstd -cf "$RUNNER_TEMP/serverless-home.tar.zst" -C "$HOME" .serverless
      - name: Upload the bundle
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: deploy-bundle
          path: |
            ${{ runner.temp }}/workspace.tar.zst
            ${{ runner.temp }}/serverless-home.tar.zst
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  deploy:
    name: Deploy Serverless PROD
    needs: [target, verify, bundle]
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    # The deploy role trusts this environment, which admits main (the monthly
    # run) and prod/* tags only (docs/REPO-SETTINGS.md, section 6).
    environment: production
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download the bundle
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: deploy-bundle
          path: ${{ runner.temp }}/bundle
      - name: Unpack the workspace and the CLI
        run: |
          tar --zstd -xf "$RUNNER_TEMP/bundle/workspace.tar.zst" -C "$GITHUB_WORKSPACE"
          tar --zstd -xf "$RUNNER_TEMP/bundle/serverless-home.tar.zst" -C "$HOME"
      - name: Use Node.js from .nvmrc
        # v7.0.0. No cache, as in the bundle job. (zizmor can't tell the
        # version from the SHA, hence the ignore.)
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # zizmor: ignore[cache-poisoning]
        with:
          node-version-file: .nvmrc
          package-manager-cache: false

      # Only hashes files, and runs before anything from the bundle does: a CLI
      # that is not the reviewed one never gets the deploy role.
      - name: Serverless CLI matches its fingerprints
        run: node scripts/check-serverless-cli.mjs

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: arn:aws:iam::228067885724:role/GithubActionsRole
          role-session-name: gha-${{ github.run_id }}
          aws-region: us-east-1

      - name: Deploy serverless PROD stack
        run: npm run serverless:deploy
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}

      # Again after the deploy: fails if the CLI fetched another release while
      # it held the role (it can replace a version the vendor has blocked).
      - name: Serverless CLI still matches its fingerprints
        run: node scripts/check-serverless-cli.mjs

      # Swap screening reads the sanctions list from Redis, and only the daily
      # refreshSanctionsJob fills it. A fresh or emptied Redis would block every
      # swap until that schedule fires, so each deploy refreshes it once. A
      # failure warns and does not fail the deploy: the code is already live.
      - name: Refresh the sanctions list
        run: |
          if ! err="$(aws lambda invoke --function-name gol-salmon-api-prod-refreshSanctionsJob \
            --cli-read-timeout 130 --query FunctionError --output text sanctions.json)" \
            || [ "$err" != "None" ]; then
            echo "::warning::refreshSanctionsJob did not complete; swaps stay blocked until its daily run."
          fi

      # Smoke the stack we just deployed on its execute-api URL, not through
      # CloudFront (the CDN can answer a cached 200 and hide a broken deploy).
      # This ALERTS only: a red step here does not roll back. Rollback stays a
      # human command — see docs/DEPLOY.md. Retries absorb the first cold start.
      # The response body is never printed.
      - name: Smoke test /health
        env:
          SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
        run: |
          # v4 writes this report to stderr.
          endpoint="$(npx serverless info --stage prod --verbose 2>&1 \
            | awk '/ServiceEndpoint:/ {print $NF; exit}')"
          if [ -z "$endpoint" ]; then
            echo "::error::Could not read ServiceEndpoint from serverless info."
            exit 1
          fi
          echo "Smoking ${endpoint}/health"
          curl --fail --show-error --silent --retry 5 --retry-delay 5 \
            --retry-all-errors --max-time 20 "${endpoint}/health" > /dev/null
          built="$(curl --fail --show-error --silent --retry 5 --retry-delay 5 \
            --retry-all-errors --max-time 20 "${endpoint}/status" | jq -r '.countryDatabase')"
          if [ -z "$built" ] || [ "$built" = "null" ]; then
            echo "::error::The deployed stack reports no country database: Swap is closed."
            exit 1
          fi
          echo "Country database built ${built}"

  report-failure:
    name: open an issue for a failed scheduled run
    needs: [target, verify, bundle, deploy]
    if: >-
      always() && github.event_name == 'schedule' &&
      (contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled'))
    permissions:
      issues: write
    uses: $/.github/workflows/report-scheduled-failure.yml
    with:
      title: Monthly prod redeploy failed
      consequence: Prod keeps last month's country database, and Swap closes once it is 45 days old.

# Weekly, grouped: one PR per ecosystem per week instead of a PR per package.
# Security updates are not limited by these groups — GitHub raises them as
# soon as an advisory lands.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    # Updates land on staging first; main only moves when staging ships.
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    # Cooldown: a freshly published version waits before being proposed, so a
    # compromised release gets caught by the ecosystem before it reaches a
    # wallet-backend PR (zizmor dependabot-cooldown).
    cooldown:
      default-days: 7
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
    # Majors arrive as separate PRs: in a wallet backend a human decides them.

  - package-ecosystem: github-actions
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    groups:
      actions:
        patterns: ['*']

  # Dockerfile base image is pinned by digest (Scorecard Pinned-Dependencies);
  # this keeps the digest moving with the node:24 tag instead of by hand.
  - package-ecosystem: docker
    directory: /
    target-branch: staging
    schedule:
      interval: weekly
      day: monday
    ignore:
      # The Lambda runtime is nodejs24.x and .nvmrc pins 24: a Node major in
      # the Dockerfile would diverge dev/CI from prod. Digest refreshes and
      # 24.x patch/minor bumps still arrive.
      - dependency-name: node
        update-types: [version-update:semver-major]

# Prod stage env values, sourced from AWS SSM Parameter Store
# (`/salmon-api/prod/*`, SecureString). Populate/rotate params with
# scripts/ssm-put-params.sh. See docs/DEPLOY.md.
#
# Vars that had a `${env:X, <default>}` fallback in the old serverless.yml
# keep that same default here (`${ssm:..., <default>}`) — the seed script
# skips empty values (SSM rejects them), so an optional var can legitimately
# have no SSM param at all. Vars that were previously required (no default)
# stay strict `${ssm:...}` so a genuinely missing secret fails loud.
provider:
  STAGE: ${self:provider.stage}
  NODE_ENV: ${ssm:/salmon-api/prod/NODE_ENV}
  SERVICE_NAME: ${ssm:/salmon-api/prod/SERVICE_NAME, 'gol-salmon-api'}
  # Redis configuration
  REDIS_HOST: ${ssm:/salmon-api/prod/REDIS_HOST}
  REDIS_PORT: ${ssm:/salmon-api/prod/REDIS_PORT}
  REDIS_PASSWORD: ${ssm:/salmon-api/prod/REDIS_PASSWORD}
  REDIS_CONNECT_TIMEOUT: ${ssm:/salmon-api/prod/REDIS_CONNECT_TIMEOUT}
  REDIS_RECONNECT_MAX_RETRIES: ${ssm:/salmon-api/prod/REDIS_RECONNECT_MAX_RETRIES}
  REDIS_FAIL_FAST_LAPSE: ${ssm:/salmon-api/prod/REDIS_FAIL_FAST_LAPSE}
  # Jupiter (Solana DEX)
  JUPITER_PRICE_URL: ${ssm:/salmon-api/prod/JUPITER_PRICE_URL}
  JUPITER_SWAP_URL: ${ssm:/salmon-api/prod/JUPITER_SWAP_URL}
  JUPITER_API_KEY: ${ssm:/salmon-api/prod/JUPITER_API_KEY}
  JUPITER_SWAP_REFERRAL_ACCOUNT: ${ssm:/salmon-api/prod/JUPITER_SWAP_REFERRAL_ACCOUNT}
  JUPITER_SWAP_REFERRAL_FEE_BPS: ${ssm:/salmon-api/prod/JUPITER_SWAP_REFERRAL_FEE_BPS}
  COINGECKO_API_KEY: ${ssm:/salmon-api/prod/COINGECKO_API_KEY, ''}
  # Solana configuration
  SOLANA_FALLBACK_MAX_RPS: ${ssm:/salmon-api/prod/SOLANA_FALLBACK_MAX_RPS, ''}
  # Triton One — primary Solana enriched-tx provider; falls back to Helius
  TRITON_RPC_URL: ${ssm:/salmon-api/prod/TRITON_RPC_URL, ''}
  TRITON_RPC_URL_DEVNET: ${ssm:/salmon-api/prod/TRITON_RPC_URL_DEVNET, ''}
  # API Keys
  HELIUS_API_KEY: ${ssm:/salmon-api/prod/HELIUS_API_KEY}
  UBIQUITY_API_KEY: ${ssm:/salmon-api/prod/UBIQUITY_API_KEY}
  # Per-IP rate limiting (src/middlewares/rate-limit.js); defaults mean the
  # SSM params are optional — create them only to override.
  #
  # The default is 'enforce', not 'log': these parameters are optional, so the
  # default is what production actually runs, and the safe value belongs in the
  # repo rather than in a parameter someone has to remember to create. Pinned
  # by src/__tests__/prod-config.spec.js so a drift shows up in CI instead of
  # only as behaviour in production.
  RATE_LIMIT_MODE: ${ssm:/salmon-api/prod/RATE_LIMIT_MODE, 'enforce'}
  RATE_LIMIT_MAX: ${ssm:/salmon-api/prod/RATE_LIMIT_MAX, '300'}
  RATE_LIMIT_TX_MAX: ${ssm:/salmon-api/prod/RATE_LIMIT_TX_MAX, '30'}
  RATE_LIMIT_WINDOW_SECONDS: ${ssm:/salmon-api/prod/RATE_LIMIT_WINDOW_SECONDS, '60'}

# Function-level-only vars (not inherited through provider.environment).
# ANALYTICS_SINK/ANALYTICS_FILE_PATH are literals: prod always forwards to
# GA4, never the local file sink.
functionOnly:
  ANALYTICS_SINK: ga4
  ANALYTICS_FILE_PATH: ''
  GA4_MEASUREMENT_ID: ${ssm:/salmon-api/prod/GA4_MEASUREMENT_ID, ''}
  GA4_API_SECRET: ${ssm:/salmon-api/prod/GA4_API_SECRET, ''}

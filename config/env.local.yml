# Local/dev stage env values, sourced from process.env (populated from `.env`
# by serverless-dotenv-plugin). Every var defaults to '' so `serverless print`
# and `serverless offline` work with zero AWS credentials, even with an
# incomplete .env. See config/env.prod.yml for the SSM-backed prod values.
#
# Each function gets only the variables its code reads: serverless.yml gives
# every function one of the maps from `api` down. The groups above them are
# merged (`<<`) into those maps.
redis: &redis
  STAGE: ${self:provider.stage}
  REDIS_HOST: ${env:REDIS_HOST, ''}
  REDIS_PORT: ${env:REDIS_PORT, ''}
  REDIS_PASSWORD: ${env:REDIS_PASSWORD, ''}
  REDIS_TLS: ${env:REDIS_TLS, 'false'}
  REDIS_CONNECT_TIMEOUT: ${env:REDIS_CONNECT_TIMEOUT, ''}
  REDIS_RECONNECT_MAX_RETRIES: ${env:REDIS_RECONNECT_MAX_RETRIES, ''}
  REDIS_FAIL_FAST_LAPSE: ${env:REDIS_FAIL_FAST_LAPSE, ''}

# Provider resilience (all optional)
resilience: &resilience
  REQUEST_BUDGET_MS: ${env:REQUEST_BUDGET_MS, ''}
  BREAKER_DISABLED: ${env:BREAKER_DISABLED, ''}
  METRICS_DISABLED: ${env:METRICS_DISABLED, ''}

coingecko: &coingecko
  COINGECKO_API_KEY: ${env:COINGECKO_API_KEY, ''}
  COINGECKO_API_URL: ${env:COINGECKO_API_URL, ''}

# Triton One — the Solana chain-data provider (RPC, DAS, tx history)
triton: &triton
  TRITON_RPC_URL: ${env:TRITON_RPC_URL, ''}

# The wallet API (src/index.js).
api:
  <<: [*redis, *resilience, *coingecko, *triton]
  NODE_ENV: ${env:NODE_ENV, ''}
  TRITON_RPC_URL_DEVNET: ${env:TRITON_RPC_URL_DEVNET, ''}
  TRM_API_KEY: ${env:TRM_API_KEY, ''}
  AVAILABILITY_TABLE_PARAMETER: ${env:AVAILABILITY_TABLE_PARAMETER, ''}
  AVAILABILITY_TABLE_JSON: ${env:AVAILABILITY_TABLE_JSON, ''}
  AVAILABILITY_COUNTRY_OVERRIDE: ${env:AVAILABILITY_COUNTRY_OVERRIDE, ''}
  JUPITER_API_KEY: ${env:JUPITER_API_KEY, ''}
  JUPITER_SWAP_API_URL: ${env:JUPITER_SWAP_API_URL, ''}
  ZEROEX_API_URL: ${env:ZEROEX_API_URL, ''}
  ZEROEX_API_KEY: ${env:ZEROEX_API_KEY, ''}
  ZEROEX_DISABLED_SOURCES: ${env:ZEROEX_DISABLED_SOURCES, ''}
  ZEROEX_SIGNING_KEYS: ${env:ZEROEX_SIGNING_KEYS, ''}
  SWAP_FEE_BPS: ${env:SWAP_FEE_BPS, ''}
  SWAP_FEE_ACCOUNT_OWNER: ${env:SWAP_FEE_ACCOUNT_OWNER, ''}
  # Powerups: compute-unit price prepended to every unsigned build
  POWERUP_PRIORITY_FEE_MICROLAMPORTS: ${env:POWERUP_PRIORITY_FEE_MICROLAMPORTS, ''}
  # The RPC the wallet itself calls, published in /v1/networks. Never the
  # Triton URL above: that one carries the provider credential. Unset falls
  # back to the public cluster, which refuses every browser origin (403).
  SOLANA_PUBLIC_RPC_URL_MAINNET: ${env:SOLANA_PUBLIC_RPC_URL_MAINNET, ''}
  SOLANA_PUBLIC_RPC_URL_DEVNET: ${env:SOLANA_PUBLIC_RPC_URL_DEVNET, ''}
  # Per-IP rate limiting (src/middlewares/rate-limit.js); defaults live in code
  RATE_LIMIT_MODE: ${env:RATE_LIMIT_MODE, 'log'}
  RATE_LIMIT_MAX: ${env:RATE_LIMIT_MAX, '300'}
  RATE_LIMIT_TX_MAX: ${env:RATE_LIMIT_TX_MAX, '30'}
  RATE_LIMIT_WINDOW_SECONDS: ${env:RATE_LIMIT_WINDOW_SECONDS, '60'}
  # Build identifiers shown by GET /status, injected by CI.
  GITHUB_SHA: ${env:GITHUB_SHA, 'GITHUB_SHA'}
  GITHUB_RUN_ID: ${env:GITHUB_RUN_ID, 'GITHUB_RUN_ID'}

# listTokensJob and refreshPricesJob (src/jobs/handler.js).
coingeckoJob:
  <<: [*redis, *coingecko]

# refreshSanctionsJob (src/jobs/handler.js).
sanctionsJob:
  <<: *redis
  SANCTIONS_SOURCE_URL: ${env:SANCTIONS_SOURCE_URL, ''}

# recordSkrSharePriceJob (src/jobs/handler.js): reads mainnet through Triton.
skrJob:
  <<: [*redis, *resilience, *triton]

# The anonymous analytics ingest (src/analytics/handler.js).
events:
  ANALYTICS_SINK: ${env:ANALYTICS_SINK, 'file'}
  ANALYTICS_FILE_PATH: ${env:ANALYTICS_FILE_PATH, ''}
  GA4_MEASUREMENT_ID: ${env:GA4_MEASUREMENT_ID, ''}
  GA4_API_SECRET: ${env:GA4_API_SECRET, ''}

# Local/dev stage env values, sourced from process.env (populated from `.env`
# by serverless-dotenv-plugin). Every var defaults to '' so `serverless print`
# and `serverless offline` work with zero AWS credentials, even with an
# incomplete .env. See config/env.prod.yml for the SSM-backed prod values.
provider:
  STAGE: ${self:provider.stage}
  NODE_ENV: ${env:NODE_ENV, ''}
  SERVICE_NAME: ${env:SERVICE_NAME, 'gol-salmon-api'}
  # Redis configuration
  REDIS_HOST: ${env:REDIS_HOST, ''}
  REDIS_PORT: ${env:REDIS_PORT, ''}
  REDIS_PASSWORD: ${env:REDIS_PASSWORD, ''}
  REDIS_CONNECT_TIMEOUT: ${env:REDIS_CONNECT_TIMEOUT, ''}
  REDIS_RECONNECT_MAX_RETRIES: ${env:REDIS_RECONNECT_MAX_RETRIES, ''}
  REDIS_FAIL_FAST_LAPSE: ${env:REDIS_FAIL_FAST_LAPSE, ''}
  # Jupiter (Solana DEX)
  JUPITER_PRICE_URL: ${env:JUPITER_PRICE_URL, ''}
  JUPITER_SWAP_URL: ${env:JUPITER_SWAP_URL, ''}
  JUPITER_API_KEY: ${env:JUPITER_API_KEY, ''}
  JUPITER_SWAP_REFERRAL_ACCOUNT: ${env:JUPITER_SWAP_REFERRAL_ACCOUNT, ''}
  JUPITER_SWAP_REFERRAL_FEE_BPS: ${env:JUPITER_SWAP_REFERRAL_FEE_BPS, ''}
  COINGECKO_API_KEY: ${env:COINGECKO_API_KEY, ''}
  # Solana configuration
  SOLANA_FALLBACK_MAX_RPS: ${env:SOLANA_FALLBACK_MAX_RPS, ''}
  # Triton One — primary Solana enriched-tx provider; falls back to Helius
  TRITON_RPC_URL: ${env:TRITON_RPC_URL, ''}
  TRITON_RPC_URL_DEVNET: ${env:TRITON_RPC_URL_DEVNET, ''}
  # API Keys
  HELIUS_API_KEY: ${env:HELIUS_API_KEY, ''}
  UBIQUITY_API_KEY: ${env:UBIQUITY_API_KEY, ''}
  # Per-IP rate limiting (src/middlewares/rate-limit.js); defaults live in code
  RATE_LIMIT_MODE: ${env:RATE_LIMIT_MODE, 'log'}
  RATE_LIMIT_MAX: ${env:RATE_LIMIT_MAX, '300'}
  RATE_LIMIT_TX_MAX: ${env:RATE_LIMIT_TX_MAX, '30'}
  RATE_LIMIT_WINDOW_SECONDS: ${env:RATE_LIMIT_WINDOW_SECONDS, '60'}

# Function-level-only vars (not inherited through provider.environment).
functionOnly:
  ANALYTICS_SINK: ${env:ANALYTICS_SINK, 'file'}
  ANALYTICS_FILE_PATH: ${env:ANALYTICS_FILE_PATH, ''}
  GA4_MEASUREMENT_ID: ${env:GA4_MEASUREMENT_ID, ''}
  GA4_API_SECRET: ${env:GA4_API_SECRET, ''}

# Prod stage env values, sourced from AWS SSM Parameter Store
# (`/salmon-api/staging/*`, SecureString). Populate/rotate params with
# scripts/ssm-put-params.sh. See docs/DEPLOY.md.
#
# Vars that had a `${env:X, <default>}` fallback in the old serverless.yml
# keep that same default here (`${ssm:..., <default>}`) — the seed script
# skips empty values (SSM rejects them), so an optional var can legitimately
# have no SSM param at all. Vars that were previously required (no default)
# stay strict `${ssm:...}` so a genuinely missing secret fails loud.
#
# Each function gets only the variables its code reads: serverless.yml gives
# every function one of the maps from `api` down, so a flaw in one function
# cannot read another function's credentials. The groups above them are
# merged (`<<`) into those maps.
redis: &redis
  STAGE: ${self:provider.stage}
  REDIS_HOST: ${ssm:/salmon-api/staging/REDIS_HOST}
  REDIS_PORT: ${ssm:/salmon-api/staging/REDIS_PORT}
  REDIS_PASSWORD: ${ssm:/salmon-api/staging/REDIS_PASSWORD}
  # 'true' once the host serves TLS; the default keeps today's plain connection
  # so a deploy before the parameter exists does not cut Redis off.
  REDIS_TLS: ${ssm:/salmon-api/staging/REDIS_TLS, 'false'}
  REDIS_CONNECT_TIMEOUT: ${ssm:/salmon-api/staging/REDIS_CONNECT_TIMEOUT}
  REDIS_RECONNECT_MAX_RETRIES: ${ssm:/salmon-api/staging/REDIS_RECONNECT_MAX_RETRIES}
  REDIS_FAIL_FAST_LAPSE: ${ssm:/salmon-api/staging/REDIS_FAIL_FAST_LAPSE}

# Provider resilience (src/infrastructure/providers): all optional
resilience: &resilience
  REQUEST_BUDGET_MS: ${ssm:/salmon-api/staging/REQUEST_BUDGET_MS, ''}
  BREAKER_DISABLED: ${ssm:/salmon-api/staging/BREAKER_DISABLED, ''}
  # METRICS_DISABLED=true until CloudWatch custom metrics fit the budget (Linear issue)
  METRICS_DISABLED: ${ssm:/salmon-api/staging/METRICS_DISABLED, ''}

# CoinGecko: Solana token catalog + USD prices (paid plan → pro-api URL), charts, exchange rates
coingecko: &coingecko
  COINGECKO_API_KEY: ${ssm:/salmon-api/staging/COINGECKO_API_KEY, ''}
  COINGECKO_API_URL: ${ssm:/salmon-api/staging/COINGECKO_API_URL, ''}

# Triton One — the Solana chain-data provider (RPC, DAS, tx history)
triton: &triton
  TRITON_RPC_URL: ${ssm:/salmon-api/staging/TRITON_RPC_URL, ''}

# The wallet API (src/index.js).
api:
  <<: [*redis, *resilience, *coingecko, *triton]
  NODE_ENV: ${ssm:/salmon-api/staging/NODE_ENV}
  TRITON_RPC_URL_DEVNET: ${ssm:/salmon-api/staging/TRITON_RPC_URL_DEVNET, ''}
  TRM_API_KEY: ${ssm:/salmon-api/staging/TRM_API_KEY, ''}
  # Name, not value: the table is read at runtime (5-minute cache), see spec 018.
  AVAILABILITY_TABLE_PARAMETER: /salmon-api/staging/AVAILABILITY_TABLE
  JUPITER_API_KEY: ${ssm:/salmon-api/staging/JUPITER_API_KEY, ''}
  JUPITER_SWAP_API_URL: ${ssm:/salmon-api/staging/JUPITER_SWAP_API_URL, ''}
  ZEROEX_API_URL: ${ssm:/salmon-api/staging/ZEROEX_API_URL, ''}
  ZEROEX_API_KEY: ${ssm:/salmon-api/staging/ZEROEX_API_KEY, ''}
  ZEROEX_DISABLED_SOURCES: ${ssm:/salmon-api/staging/ZEROEX_DISABLED_SOURCES, ''}
  ZEROEX_SIGNING_KEYS: ${ssm:/salmon-api/staging/ZEROEX_SIGNING_KEYS, ''}
  SWAP_FEE_BPS: ${ssm:/salmon-api/staging/SWAP_FEE_BPS, ''}
  SWAP_FEE_ACCOUNT_OWNER: ${ssm:/salmon-api/staging/SWAP_FEE_ACCOUNT_OWNER, ''}
  # Powerups: compute-unit price prepended to every unsigned build
  POWERUP_PRIORITY_FEE_MICROLAMPORTS: ${ssm:/salmon-api/staging/POWERUP_PRIORITY_FEE_MICROLAMPORTS, ''}
  # The RPC the wallet itself calls, published in /v1/networks. Never the
  # Triton URL above: that one carries the provider credential. Unset falls
  # back to the public cluster, which refuses every browser origin (403).
  SOLANA_PUBLIC_RPC_URL_MAINNET: ${ssm:/salmon-api/staging/SOLANA_PUBLIC_RPC_URL_MAINNET, ''}
  SOLANA_PUBLIC_RPC_URL_DEVNET: ${ssm:/salmon-api/staging/SOLANA_PUBLIC_RPC_URL_DEVNET, ''}
  # Per-IP rate limiting (src/middlewares/rate-limit.js); defaults mean the
  # SSM params are optional — create them only to override.
  #
  # The default is 'enforce', not 'log': these parameters are optional, so the
  # default is what production actually runs, and the safe value belongs in the
  # repo rather than in a parameter someone has to remember to create. Pinned
  # by src/__tests__/prod-config.spec.js so a drift shows up in CI instead of
  # only as behaviour in production.
  RATE_LIMIT_MODE: ${ssm:/salmon-api/staging/RATE_LIMIT_MODE, 'enforce'}
  RATE_LIMIT_MAX: ${ssm:/salmon-api/staging/RATE_LIMIT_MAX, '300'}
  RATE_LIMIT_TX_MAX: ${ssm:/salmon-api/staging/RATE_LIMIT_TX_MAX, '30'}
  RATE_LIMIT_WINDOW_SECONDS: ${ssm:/salmon-api/staging/RATE_LIMIT_WINDOW_SECONDS, '60'}
  # Build identifiers shown by GET /status, injected by CI.
  GITHUB_SHA: ${env:GITHUB_SHA, 'GITHUB_SHA'}
  GITHUB_RUN_ID: ${env:GITHUB_RUN_ID, 'GITHUB_RUN_ID'}

# listTokensJob and refreshPricesJob (src/jobs/handler.js).
coingeckoJob:
  <<: [*redis, *coingecko]

# refreshSanctionsJob (src/jobs/handler.js).
sanctionsJob:
  <<: *redis
  SANCTIONS_SOURCE_URL: ${ssm:/salmon-api/staging/SANCTIONS_SOURCE_URL, ''}

# recordSkrSharePriceJob (src/jobs/handler.js): reads mainnet through Triton.
skrJob:
  <<: [*redis, *resilience, *triton]

# The anonymous analytics ingest (src/analytics/handler.js).
# The one place staging is not a mirror of prod: testers' events go to the
# file sink in Lambda's scratch space (/tmp, discarded with the container),
# never to GA4, so they cannot pollute the production analytics property.
events:
  ANALYTICS_SINK: file
  ANALYTICS_FILE_PATH: /tmp/analytics-events.ndjson
  GA4_MEASUREMENT_ID: ''
  GA4_API_SECRET: ''

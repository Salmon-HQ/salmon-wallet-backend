# Redis Configuration for Local Development
# Minimal configuration to suppress warnings and optimize for local dev

# Bind to all interfaces (safe in Docker network)
bind 0.0.0.0

# Port
port 6379

# Persistence (RDB)
save 900 1
save 300 10
save 60 10000

# Directory for dump files
dir /data

# Logging
loglevel notice
logfile ""

# Memory Management
maxmemory 1gb
maxmemory-policy allkeys-lru

# Append Only File (AOF) - disabled for local dev
appendonly no

# Performance
tcp-backlog 511
timeout 0
tcp-keepalive 300

# Disable protected mode (safe within Docker network)
protected-mode no

# Suppress warnings
daemonize no
supervised no

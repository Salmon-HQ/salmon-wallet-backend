service: gol-salmon-api
frameworkVersion: '3'

plugins:
  - serverless-offline
  - serverless-dotenv-plugin
  - serverless-api-gateway-throttling

useDotenv: true

provider:
  name: aws
  runtime: nodejs24.x
  stage: ${opt:stage, 'prod'}
  region: us-east-1
  versionFunctions: false
  # Request logs pair a client IP with the request path, and wallet routes carry
  # the address in the path. Without this, CloudWatch keeps that pairing forever.
  logRetentionInDays: 30
  apiGateway:
    shouldStartNameWithService: true
  # No provider-level environment: each function below takes only its own map
  # from config/env.<stage>.yml (see custom.envFile), so no function holds a
  # credential it never reads.
  # The availability table is the one parameter read at runtime (spec 018):
  # a country change is an SSM edit, never a release.
  iam:
    role:
      # Caps the Lambda role at aws-lambda-permissions-boundary.json (its log
      # groups and the availability table, nothing in IAM) whatever policy is
      # put on it. The deploy role may only create or change project roles
      # that carry this boundary (aws-deploy-policy.json); rollout order in
      # docs/DEPLOY.md, "CI IAM permissions".
      permissionsBoundary: !Sub arn:aws:iam::${AWS::AccountId}:policy/gol-salmon-api-lambda-boundary
      statements:
        - Effect: Allow
          Action: ssm:GetParameter
          Resource: !Sub arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/salmon-api/${sls:stage}/AVAILABILITY_TABLE

functions:
  listTokensJob:
    handler: src/jobs/handler.listTokensJob
    timeout: 60
    events:
      - schedule:
          rate: rate(1 hour)
          enabled: true
          name: listTokensJobBtc-${self:provider.stage}
          input:
            platform: bitcoin
    environment: ${self:custom.envFile.coingeckoJob}

  refreshPricesJob:
    handler: src/jobs/handler.refreshPricesJob
    timeout: 60
    events:
      - schedule:
          rate: rate(60 minutes)
          enabled: true
          name: refreshPricesJobBtc-${self:provider.stage}
          input:
            platform: bitcoin
    environment: ${self:custom.envFile.coingeckoJob}

  # Daily copy of the US Treasury SDN digital-currency addresses, the
  # authoritative layer of sanctions screening (spec 018).
  refreshSanctionsJob:
    handler: src/jobs/handler.refreshSanctionsJob
    timeout: 120
    events:
      - schedule:
          rate: rate(1 day)
          enabled: true
          name: refreshSanctionsJob-${self:provider.stage}
    environment: ${self:custom.envFile.sanctionsJob}

  # SKR's staking share price, recorded daily just after the 02:00 UTC payout
  # so the SKR reward history is exact from the first record (spec 022).
  recordSkrSharePriceJob:
    handler: src/jobs/handler.recordSkrSharePriceJob
    timeout: 30
    events:
      - schedule:
          rate: cron(5 2 * * ? *)
          enabled: true
          name: recordSkrSharePriceJob-${self:provider.stage}
    environment: ${self:custom.envFile.skrJob}

  api:
    handler: src/index.handler
    timeout: 60
    # Ceiling on executions, and so on Lambda spend, whatever API Gateway
    # lets through; the remaining account concurrency stays for the analytics
    # ingest and the scheduled jobs. Needs lambda:PutFunctionConcurrency on
    # the deploy role (aws-deploy-policy.json).
    reservedConcurrency: 300
    events:
      - http: ANY /
      - http: ANY /{proxy+}
      # Its own token bucket, so a flood on this endpoint (the one request
      # floods have targeted) exhausts only this route: the wallets fall back
      # to USD prices, and every other route keeps its own budget. The explicit
      # route wins over {proxy+}; the handler is the same Express app.
      - http:
          path: /v1/exchange-rates
          method: get
          throttling:
            maxRequestsPerSecond: 20
            maxConcurrentRequests: 40
    environment: ${self:custom.envFile.api}

  # Anonymous usage-analytics ingest. A dedicated function (not the catch-all
  # `api`) so an event-traffic spike can't starve wallet-API concurrency. The
  # explicit `POST /v1/events` route wins over the api function's `{proxy+}`.
  # Defaults to the file sink (no external dependency); set ANALYTICS_SINK=ga4
  # plus GA4_MEASUREMENT_ID/GA4_API_SECRET to forward to Google Analytics 4 via
  # the Measurement Protocol (see docs/ANALYTICS.md). The handler never reads the
  # client IP, and the ga4 sink never forwards it, so the user's IP never reaches
  # Google — only this function's IP does.
  events:
    handler: src/analytics/handler.handler
    timeout: 15
    reservedConcurrency: 20
    events:
      - http:
          path: /v1/events
          method: post
          cors: true
    environment: ${self:custom.envFile.events}

custom:
  # Single reference per stage — config/env.local.yml (plain env vars) or
  # config/env.prod.yml (SSM). Only the file matching the active stage is
  # ever loaded, so `--stage local` never touches SSM/AWS credentials.
  envFile: ${file(./config/env.${sls:stage}.yml)}
  # Aggregate stage-level throttling (all endpoints). Per-IP limits are
  # handled by the Express rate-limit middleware; this is the blunt outer cap.
  # Per method (ANY /, ANY /{proxy+}, the exchange-rates route, POST
  # /v1/events each get a bucket): 200 requests per second sustained, 400 as
  # burst. About 600 times the API's normal rate; Lambda spend is bounded by
  # the functions' reservedConcurrency, not by this. A flood paced under the
  # WAF per-IP caps can still fill a bucket (the floods of 2026-11-11 did at
  # 50 rps): the exchange-rates route has its own so that it fails alone.
  apiGatewayThrottling:
    maxRequestsPerSecond: 200
    maxConcurrentRequests: 400
  # AWS WAF per-IP caps (resources.ApiWebAcl): requests one source IP may
  # send in any 60 s before the rule blocks it, applied before the request
  # reaches API Gateway's throttle, so no client can hold the shared stage
  # throttle above at its ceiling. The wallets send a few dozen requests a
  # minute at most, even on a pull-to-refresh spree. The Express per-IP limit
  # (RATE_LIMIT_MAX per RATE_LIMIT_WINDOW_SECONDS in src/index.js) stays as
  # the inner layer.
  wafRateLimitPerIp: 150
  # Cap for the routes that call a provider (balances, history, NFTs, stakes,
  # SKR staking, prices, token search, dApp metadata, Powerups, swap): a flood there also burns Triton, Helius and
  # CoinGecko quota, which costs every user a longer outage than the flood.
  wafProviderPathsLimitPerIp: 100
  # Tighter cap for GET /v1/exchange-rates, the endpoint request floods have
  # targeted: the clients fetch it once per 15 minutes, so a source IP above
  # this in 60 s is not a wallet.
  wafExchangeRatesLimitPerIp: 30
  # Cap for addresses AWS lists as cloud hosting providers (rented servers).
  # A flood spread over thousands of such addresses stays under the caps
  # above; a GitHub Actions runner (Azure) checking /status or a wallet user
  # on a datacenter-hosted VPN sends a handful a minute and stays under this.
  wafHostingProvidersLimitPerIp: 20
  # Cap for all hosting-provider addresses together, in 60 s: a rented fleet
  # pacing each address under the cap above still adds up, while legitimate
  # datacenter traffic (CI checks, VPN users) is a few hundred a minute.
  wafHostingProvidersLimitTotal: 3000
  # `block` blocks; `count` only records the IPs over the caps. The regional
  # web ACL sees client addresses on this edge-optimized API (docs/DEPLOY.md,
  # "AWS WAF in front of the API"), so the rules block.
  wafRuleAction: block
  # The AWS anti-DDoS managed group: `count` while it builds its traffic
  # baseline (AWS asks for normal traffic first), `block` afterwards.
  wafAntiDdosAction: count
  serverless-offline:
    host: 0.0.0.0
    httpPort: ${env:OFFLINE_HTTP_PORT, 3000}
    lambdaPort: ${env:OFFLINE_LAMBDA_PORT, 3002}
  # Function environments are assigned explicitly from custom.envFile (see
  # above), so the plugin's auto-inject-into-provider.environment feature is
  # disabled (include: []): it would hand every function every variable in the
  # dotenv file, undoing the per-function scoping. The plugin still loads that
  # file into process.env for ${env:X} resolution, which `include` does not
  # affect.
  dotenv:
    include: []

resources:
  # AWS WAF on production only: it costs USD 6 a month per stage, and staging
  # carries partner tests, not public traffic. One rate-based rule counts, or
  # with custom.wafRuleAction `block` blocks, a source IP above
  # custom.wafRateLimitPerIp requests per 60 s. Cost and the deploy role's
  # WAF permissions: docs/DEPLOY.md.
  Conditions:
    IsProd: !Equals ['${sls:stage}', 'prod']
    WafRuleBlocks: !Equals ['${self:custom.wafRuleAction}', 'block']
    AntiDdosBlocks: !Equals ['${self:custom.wafAntiDdosAction}', 'block']
  Resources:
    ApiWebAcl:
      Type: AWS::WAFv2::WebACL
      Condition: IsProd
      Properties:
        Name: ${self:service}-${sls:stage}-api
        Scope: REGIONAL
        DefaultAction:
          Allow: {}
        VisibilityConfig:
          CloudWatchMetricsEnabled: true
          SampledRequestsEnabled: true
          MetricName: ${self:service}-${sls:stage}-api
        Rules:
          # AWS's application-layer DDoS protection: it learns the API's
          # normal traffic and, during an event, blocks the requests that
          # take part in it, however many addresses they come from. Requests
          # it blocks are not charged WAF's per-request fee. AWS asks for it
          # first in the ACL and for a baseline before it blocks, so it
          # starts counting (custom.wafAntiDdosAction). Its browser challenge
          # is disabled: a challenge is solved by a browser, and the wallets
          # are native apps.
          - Name: aws-anti-ddos
            Priority: 0
            OverrideAction: !If [AntiDdosBlocks, { None: {} }, { Count: {} }]
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesAntiDDoSRuleSet
                ManagedRuleGroupConfigs:
                  - AWSManagedRulesAntiDDoSRuleSet:
                      # LOW blocks only the requests the group is most sure
                      # of; raise during a sustained event.
                      SensitivityToBlock: LOW
                      ClientSideActionConfig:
                        Challenge:
                          UsageOfAction: DISABLED
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              SampledRequestsEnabled: true
              MetricName: aws-anti-ddos
          # A rate rule answers 429, the status the Express limiter uses, so
          # a client never mistakes it for the availability 403.
          - Name: per-ip-rate-limit
            Priority: 1
            Action:
              !If &rateAction [
                WafRuleBlocks,
                { Block: { CustomResponse: { ResponseCode: 429 } } },
                { Count: {} },
              ]
            Statement:
              RateBasedStatement:
                AggregateKeyType: IP
                EvaluationWindowSec: 60
                Limit: ${self:custom.wafRateLimitPerIp}
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              SampledRequestsEnabled: true
              MetricName: per-ip-rate-limit
          - Name: exchange-rates-rate-limit
            Priority: 2
            Action: *rateAction
            Statement:
              RateBasedStatement:
                AggregateKeyType: IP
                EvaluationWindowSec: 60
                Limit: ${self:custom.wafExchangeRatesLimitPerIp}
                ScopeDownStatement:
                  ByteMatchStatement:
                    FieldToMatch:
                      UriPath: {}
                    PositionalConstraint: CONTAINS
                    SearchString: /v1/exchange-rates
                    # Express routes paths case-insensitively and decodes
                    # them, so the match sees the path the way Express does.
                    TextTransformations:
                      - Priority: 0
                        Type: URL_DECODE
                      - Priority: 1
                        Type: NORMALIZE_PATH
                      - Priority: 2
                        Type: LOWERCASE
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              SampledRequestsEnabled: true
              MetricName: exchange-rates-rate-limit
          - Name: provider-paths-rate-limit
            Priority: 3
            Action: *rateAction
            Statement:
              RateBasedStatement:
                AggregateKeyType: IP
                EvaluationWindowSec: 60
                Limit: ${self:custom.wafProviderPathsLimitPerIp}
                ScopeDownStatement:
                  OrStatement:
                    Statements:
                      - ByteMatchStatement:
                          FieldToMatch:
                            UriPath: {}
                          PositionalConstraint: CONTAINS
                          SearchString: /account/
                          TextTransformations: &pathTransforms
                            - Priority: 0
                              Type: URL_DECODE
                            - Priority: 1
                              Type: NORMALIZE_PATH
                            - Priority: 2
                              Type: LOWERCASE
                      - ByteMatchStatement:
                          FieldToMatch:
                            UriPath: {}
                          PositionalConstraint: CONTAINS
                          SearchString: /nft
                          TextTransformations: *pathTransforms
                      - ByteMatchStatement:
                          FieldToMatch:
                            UriPath: {}
                          PositionalConstraint: CONTAINS
                          SearchString: /chart/
                          TextTransformations: *pathTransforms
                      - ByteMatchStatement:
                          FieldToMatch:
                            UriPath: {}
                          PositionalConstraint: CONTAINS
                          SearchString: /coin/
                          TextTransformations: *pathTransforms
                      - ByteMatchStatement:
                          FieldToMatch:
                            UriPath: {}
                          PositionalConstraint: CONTAINS
                          SearchString: /dapp/
                          TextTransformations: *pathTransforms
                      - ByteMatchStatement:
                          FieldToMatch:
                            UriPath: {}
                          PositionalConstraint: CONTAINS
                          SearchString: /ft/swap
                          TextTransformations: *pathTransforms
                      - ByteMatchStatement:
                          FieldToMatch:
                            UriPath: {}
                          PositionalConstraint: CONTAINS
                          SearchString: /ft/search
                          TextTransformations: *pathTransforms
                      - ByteMatchStatement:
                          FieldToMatch:
                            UriPath: {}
                          PositionalConstraint: CONTAINS
                          SearchString: /skr/
                          TextTransformations: *pathTransforms
                      - ByteMatchStatement:
                          FieldToMatch:
                            UriPath: {}
                          PositionalConstraint: CONTAINS
                          SearchString: /powerups/
                          TextTransformations: *pathTransforms
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              SampledRequestsEnabled: true
              MetricName: provider-paths-rate-limit
          # Addresses AWS lists as sources of attacks (bots, scanners,
          # reconnaissance, DDoS). A wallet user is never on it. The group
          # ships its DDoS list counting; here it blocks.
          - Name: aws-ip-reputation
            Priority: 4
            OverrideAction: !If [WafRuleBlocks, { None: {} }, { Count: {} }]
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesAmazonIpReputationList
                RuleActionOverrides:
                  - Name: AWSManagedIPDDoSList
                    ActionToUse:
                      Block: {}
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              SampledRequestsEnabled: true
              MetricName: aws-ip-reputation
          # AWS's lists of VPN, proxy and Tor exits (AnonymousIPList) and of
          # cloud hosting providers (HostingProviderIPList). The group only
          # labels the request: blocking every datacenter address would also
          # block GitHub Actions runners (the deploy and daily checks), store
          # reviewers' device farms and users on datacenter-hosted VPNs. The
          # rule below caps the hosting-provider ones instead.
          - Name: aws-anonymous-ip-labels
            Priority: 5
            OverrideAction:
              None: {}
            Statement:
              ManagedRuleGroupStatement:
                VendorName: AWS
                Name: AWSManagedRulesAnonymousIpList
                RuleActionOverrides:
                  - Name: AnonymousIPList
                    ActionToUse:
                      Count: {}
                  - Name: HostingProviderIPList
                    ActionToUse:
                      Count: {}
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              SampledRequestsEnabled: true
              MetricName: aws-anonymous-ip-labels
          - Name: hosting-providers-rate-limit
            Priority: 6
            Action: *rateAction
            Statement:
              RateBasedStatement:
                AggregateKeyType: IP
                EvaluationWindowSec: 60
                Limit: ${self:custom.wafHostingProvidersLimitPerIp}
                ScopeDownStatement:
                  LabelMatchStatement:
                    Scope: LABEL
                    Key: awswaf:managed:aws:anonymous-ip-list:HostingProviderIPList
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              SampledRequestsEnabled: true
              MetricName: hosting-providers-rate-limit
          - Name: hosting-providers-total-limit
            Priority: 7
            Action: *rateAction
            Statement:
              RateBasedStatement:
                AggregateKeyType: CONSTANT
                EvaluationWindowSec: 60
                Limit: ${self:custom.wafHostingProvidersLimitTotal}
                ScopeDownStatement:
                  LabelMatchStatement:
                    Scope: LABEL
                    Key: awswaf:managed:aws:anonymous-ip-list:HostingProviderIPList
            VisibilityConfig:
              CloudWatchMetricsEnabled: true
              SampledRequestsEnabled: true
              MetricName: hosting-providers-total-limit
    # The stage only exists once the API Gateway deployment has created it;
    # Serverless names that deployment ApiGatewayDeployment<instanceId>.
    ApiWebAclAssociation:
      Type: AWS::WAFv2::WebACLAssociation
      Condition: IsProd
      DependsOn: ApiGatewayDeployment${sls:instanceId}
      Properties:
        ResourceArn: !Sub arn:${AWS::Partition}:apigateway:${AWS::Region}::/restapis/${ApiGatewayRestApi}/stages/${sls:stage}
        WebACLArn: !GetAtt ApiWebAcl.Arn
  Outputs:
    ServiceEndpoint:
      Export:
        Name: !Sub ${AWS::StackName}-ServiceEndpoint
